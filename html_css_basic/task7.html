<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 7</title>
    <style>
        .photo{
            width: 300px;
            height: 300px;
            border: 5px solid red;
            object-fit: cover;
            transition: border-color 0.2s, opacity 0.2s;
        }

        .photo:hover{
            border-color: green;
            opacity: 0.75s;
        }
    </style>
</head>
<body>
    <img class="photo" src="images/photo1.jpg" alt="A sample photo">
</body>
</html>
