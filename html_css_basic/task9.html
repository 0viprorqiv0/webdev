<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 9</title>
    <style>
        table{
            width: 600px;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            text-align: center;    
        }

        th,
        td{
            padding: 14px;
            border: 1px solid white;
        }

        thead{
            color: white;
            background-color: #28558a;
        }

        tbody tr:nth-child(odd){
            background-color: #cbd5e5;
        }

        tbody tr:nth-child(even){
            background-color: #e6ebf3;
        }

        tbody tr:hover{
            background-color: #ffe082;
        }
    </style>
</head>
<body>
    <table>
        <head>
            <tr>
                <th>Subject</th>
                <th>ECTs</th>
            </tr>
        </head>
        <tbody>
            <tr>
                <td>Math</td>
                <td>3</td>
            </tr>
            <tr>
                <td>Physics</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Chemistry</td>
                <td>4</td>
            </tr>
            <tr>
                <td>English</td>
                <td>3</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
