<!doctype html>
<html>
  <head>
    <title>Pho Thin - Menu</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }
      h1 {
        color: #b00000;
        text-align: center;
      }
      .title {
        font-style: italic;
        color: gray;
      }
      .price {
        font-weight: bold;
        color: #b00000;
      }
      table {
        border-collapse: collapse;
      }
      table,
      th,
      td {
        border: 1px solid #999;
        padding: 8px;
      }
      th {
        background-color: #b00000;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Pho Thin</h1>
    <p class="title">Since 1979</p>

    <h2>Our bowls</h2>
    <ul>
      <li>Pho bo</li>
      <li>Pho ga</li>
      <li>Pho tai</li>
    </ul>

    <h2>Prices</h2>
    <table>
      <tr>
        <th colspan="2">Menu of the day</th>
      </tr>
      <tr>
        <td>Pho bo</td>
        <td class="price">60,000</td>
      </tr>
      <tr>
        <td>Pho ga</td>
        <td class="price">55,000</td>
      </tr>
    </table>
    <h2>Find us</h2>
    <p>
      <a href="https://phothin.vn">Visit our website</a>
      Open 6am - 10am, closed on Monday.
    </p>

    <img src="bowl.jpg" alt="A bowl of Pho Thin" />
  </body>
</html>
